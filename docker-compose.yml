# EnergyPulse : toute la plateforme en local (Docker Desktop).
#   docker compose up -d --build
# Ports : Postgres 5440 · Kafka 9094 · Kafka UI 8095 · API 8030 · Airflow 8090 · Spark UI 4040

x-app: &app
  build: { context: ., dockerfile: docker/app.Dockerfile }
  image: energypulse-app:1.0
  env_file: .env
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RAW_DATA_DIR: /data/raw
  volumes:
    - ./data/raw:/data/raw
    - ./ingestion/energypulse:/opt/energypulse/energypulse
    - ./scripts:/opt/scripts
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }

x-airflow: &airflow
  build: { context: ., dockerfile: docker/airflow.Dockerfile }
  image: energypulse-airflow:2.10.5
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: energypulse-local
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    KAFKA_BOOTSTRAP: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RAW_DATA_DIR: /data/raw
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./ingestion/energypulse:/opt/energypulse/energypulse
    - ./data/raw:/data/raw
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    container_name: ep-postgres
    env_file: .env
    ports: ["5440:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # scripts exécutés au 1er démarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: ep-kafka
    ports: ["9094:9094"]
    environment:
      CLUSTER_ID: RW5lcmd5UHVsc2VLUmFmdA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # mode KRaft : pas de ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # les topics sont créés explicitement
      KAFKA_LOG_RETENTION_HOURS: 168                  # on garde 7 jours de messages
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:
    <<: *app
    container_name: ep-kafka-init
    command: ["python", "-m", "energypulse.pipeline", "init-topics"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ep-kafka-ui
    ports: ["8095:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: energypulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  consumer:
    <<: *app
    container_name: ep-consumer
    command: ["python", "-m", "energypulse.consumer"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  spark:
    image: apache/spark:3.5.3-python3
    container_name: ep-spark
    user: root
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SPARK_CHECKPOINT: /checkpoints/generation_mix
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.4
      - /opt/jobs/stream_generation_mix.py
    ports: ["4040:4040"]
    volumes:
      - ./spark:/opt/jobs:ro
      - spark-checkpoints:/checkpoints
      - spark-ivy:/ivy
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  api:
    <<: *app
    container_name: ep-api
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8030"]
    ports: ["8030:8030"]
    volumes:
      - ./api:/opt/api
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Conteneur « boîte à outils » pour les commandes ponctuelles :
  #   docker compose run --rm app python -m energypulse.pipeline replay ...
  app:
    <<: *app
    profiles: ["tools"]

  airflow-init:
    <<: *airflow
    container_name: ep-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Energy --lastname Pulse --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow
    container_name: ep-airflow-web
    command: webserver
    ports: ["8090:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    container_name: ep-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  spark-checkpoints:
  spark-ivy:
  airflow-logs:
